<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800">
  <!-- taskly DMG background: rendered at 2x for the 660x400 Finder window.
       Icon slots sit at window {130,160} and {450,160} (2x centers 340/980
       on the y=400 midline); keep both regions free of text and artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5f1"/>
      <stop offset="1" stop-color="#f2e4db"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="800" fill="url(#bg)"/>
  <rect x="14" y="14" width="1292" height="772" rx="26" fill="none" stroke="#c15f3c" stroke-opacity="0.16" stroke-width="2"/>

  <text x="660" y="150" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="88" font-weight="600" letter-spacing="2" fill="#2b211b">Taskly</text>
  <text x="660" y="216" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#2b211b" fill-opacity="0.62">A focused, keyboard-friendly task manager</text>

  <!-- Explicit direction label is separate from the Finder icon labels. -->
  <text x="660" y="352" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="5"
        fill="#895849">DRAG TO INSTALL</text>

  <!-- Keep the drag cue on the line connecting Finder's two icon slots.
       Straight geometry avoids the prior upward arc looking detached from
       the icons; neither the stroke nor head overlaps the 80pt icons. -->
  <path d="M 456 418 H 828"
        fill="none" stroke="#c15f3c" stroke-opacity="0.75"
        stroke-width="9" stroke-linecap="round"/>
  <path d="M 822 389 L 861 418 L 822 447"
        fill="none" stroke="#c15f3c" stroke-opacity="0.88"
        stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

  <text x="660" y="672" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" fill="#2b211b" fill-opacity="0.8">Drag Taskly into Applications</text>
</svg>
