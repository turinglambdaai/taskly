name: CI

on:
  push:
    branches: [main, experiment/taskly-rivet]
    paths:
      - 'racket/**'
      - 'shared/cli-golden/**'
      - 'shared/i18n/**'
      - 'rivet.rktd'
      - 'scripts/taskly-cli.*'
      - 'windows/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'racket/**'
      - 'shared/cli-golden/**'
      - 'rivet.rktd'
      - 'windows/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Migration policy: exact Rivet pins in CI (docs/RIVET-MIGRATION.md §6).
  RIVET_COMMIT: f37908fcf0aad02665227beec39c354c76952886

jobs:
  core:
    name: Racket core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Test core contracts
        run: raco test racket/tests/core-test.rkt

  backend-and-cli:
    name: Backend + CLI golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout "$RIVET_COMMIT"
          raco pkg install --auto --no-docs --name rivet --link "$RUNNER_TEMP/rivet"
      - name: Compile backend
        run: raco make racket/taskly/backend.rkt
      - name: Test full core (incl. typed Rivet schema)
        run: raco test racket/
      - name: CLI golden suite (61 cases, byte-identical)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # CreateProcess cannot resolve a relative .cmd — hand cmd.exe an
            # absolute backslash path instead.
            BIN="$(cygpath -w "$PWD/scripts/taskly-cli.cmd")"
          else
            BIN="$PWD/scripts/taskly-cli.sh"
          fi
          python3 shared/cli-golden/runner.py --binary "$BIN"

  windows-host:
    name: Windows host build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        shell: pwsh
        run: |
          git clone https://github.com/turinglambdaai/rivet.git "$env:RUNNER_TEMP\rivet"
          git -C "$env:RUNNER_TEMP\rivet" checkout $env:RIVET_COMMIT
          raco pkg install --auto --no-docs --name rivet --link "$env:RUNNER_TEMP\rivet"
      - name: Build host (regenerates the generated client)
        shell: pwsh
        run: raco rivet build
      - name: Generated client matches the pin
        shell: pwsh
        run: |
          git diff --exit-code windows/GeneratedBackend.hpp
          if ($LASTEXITCODE -ne 0) { throw 'windows/GeneratedBackend.hpp is stale against the pinned Rivet' }
      - name: Staged executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path '.rivet\stage\RivetHost.exe')) { throw 'staged RivetHost.exe missing' }
