<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Taskly brand icon: system-blue rounded square + white checkmark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0062CC"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (22.5% radius = macOS squircle) -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- White checkmark, centered -->
  <polyline
    points="156,276 232,352 372,192"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
