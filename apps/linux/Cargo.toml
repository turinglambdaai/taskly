[package]
name = "taskly"
version = "1.0.0"
edition = "2021"
description = "Taskly — focused personal task manager (GTK4/libadwaita native)"
license = "Apache-2.0"

[[bin]]
name = "taskly"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "1", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
