app-id: app.taskly.Taskly
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: taskly
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: taskly
    buildsystem: meson
    builddir: true
    sources:
      - type: dir
        path: ..
